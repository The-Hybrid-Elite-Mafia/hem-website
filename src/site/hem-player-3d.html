<title>HEM Player 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: one full-window WebGL stage holding the 3D HEM Listening Player; a small HUD floats top-left, a hint bottom-left. */
:root{
  color-scheme: dark;
  --bg:#04040a; --ink:#f4f1fb; --dim:#c9c3dc; --faint:#948eaa;
  --cyan:#22e4ff; --violet:#7b3cff; --magenta:#ff2fb9; --orange:#ff7a1a; --gold:#ffc94a;
  --font-display:'Orbitron','Rajdhani',system-ui,sans-serif;
  --font-body:'Rajdhani',system-ui,'Segoe UI',sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage.pointing{cursor:pointer}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;pointer-events:none}
.hud h1{margin:0;font:700 clamp(14px,1.6vw,18px)/1.1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta),var(--orange),var(--gold),var(--cyan));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 10s linear infinite}
.hud .tag{font:600 12px/1.2 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:3px 9px}
.hint{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin:0;padding-right:76px;font:500 14px/1.35 var(--font-body);color:var(--dim);pointer-events:none;max-width:70ch}
.readout{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:700 15px/1 var(--font-display);letter-spacing:.08em;color:var(--ink);background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 55%,transparent);border-radius:8px;padding:8px 12px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center;font:600 16px/1.4 var(--font-body);color:var(--dim)}
@keyframes flow{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.hud h1{animation:none}}
</style>

<canvas id="stage" aria-label="3D HEM Listening Player. Drag empty space to turn it."></canvas>
<div class="hud"><h1>HEM Player 3D</h1><span class="tag">Test build</span></div>
<p class="readout" id="readout" hidden></p>
<p class="hint" id="hint">Pinch, double-tap or press + to zoom in, then drag to move around. Turn your phone sideways for a bigger player. Tap ADD SONGS to play songs from this device; they never leave it.</p>
<div class="err" id="err" hidden>This page needs WebGL to draw the 3D player, and this browser didn't allow it.</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- HEM Blend (locked) ----------
const BLEND = ['#22e4ff', '#7b3cff', '#ff2fb9', '#ff7a1a', '#ffc94a'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FLOW = REDUCED ? 0.012 : 0.05;           // how fast the colours travel (loops per second)
const canvas = document.getElementById('stage');

// design space: 1920 x 1080 px, 100 px = 1 world unit
const X = px => (px - 960) / 100;
const Y = py => (540 - py) / 100;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('err').hidden = false;
  document.getElementById('hint').hidden = true;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#04040a');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
const player = new THREE.Group();
scene.add(player);

// ---------- helpers ----------
function rrPath(P, x, y, w, h, r) {
  const x0 = X(x), x1 = X(x + w), y0 = Y(y), y1 = Y(y + h), R = r / 100;
  P.moveTo(x0 + R, y1);
  P.lineTo(x1 - R, y1); P.quadraticCurveTo(x1, y1, x1, y1 + R);
  P.lineTo(x1, y0 - R); P.quadraticCurveTo(x1, y0, x1 - R, y0);
  P.lineTo(x0 + R, y0); P.quadraticCurveTo(x0, y0, x0, y0 - R);
  P.lineTo(x0, y1 + R); P.quadraticCurveTo(x0, y1, x0 + R, y1);
  return P;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function blendAt(t) { // a colour on the HEM Blend loop, t 0..1
  t = ((t % 1) + 1) % 1;
  const s = t * BLEND.length, i = Math.floor(s), f = s - i;
  return new THREE.Color(BLEND[i % BLEND.length]).lerp(new THREE.Color(BLEND[(i + 1) % BLEND.length]), f);
}
function blendCss(t, a = 1) { const c = blendAt(t); return `rgba(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)},${a})`; }
// a moving HEM Blend gradient across x0..x1 (phase 0..1 slides the colours along)
function blendGrad(g, x0, x1, phase, y0 = 0, y1 = 0) {
  const span = x1 - x0, start = x0 - (((phase % 1) + 1) % 1) * span;
  const gr = g.createLinearGradient(start, y0, start + 2 * span, y1);
  const n = BLEND.length;
  for (let k = 0; k <= 2 * n; k++) gr.addColorStop(k / (2 * n), BLEND[k % n]);
  return gr;
}
function text(g, s, x, y, size, color, align = 'left', font = 'Rajdhani', weight = 600, spacing = 0.12) {
  g.save();
  g.font = `${weight} ${size}px ${font}, system-ui, sans-serif`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
  if ('letterSpacing' in g) g.letterSpacing = `${size * spacing}px`;
  g.fillText(s, x, y);
  g.restore();
}
function brushedMap() {
  const c = makeCanvas(1024, 256), g = c.getContext('2d');
  g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 2600; i++) {
    const y = Math.random() * 256, v = 90 + Math.random() * 60;
    g.strokeStyle = `rgba(${v},${v},${v},${0.25 + Math.random() * 0.35})`;
    g.lineWidth = Math.random() < 0.15 ? 1.6 : 0.6;
    g.beginPath(); const x = Math.random() * 1024; g.moveTo(x, y); g.lineTo(x + 80 + Math.random() * 500, y); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.12, 0.35);
  return t;
}
const brushed = brushedMap();

// ---------- materials ----------
const M = {
  body: new THREE.MeshPhysicalMaterial({ color: '#23262e', metalness: 1, roughness: 0.34, roughnessMap: brushed, clearcoat: 0.5, clearcoatRoughness: 0.2, envMapIntensity: 1.1 }),
  plate: new THREE.MeshPhysicalMaterial({ color: '#1f2128', metalness: 1, roughness: 0.34, roughnessMap: brushed, clearcoat: 0.6, clearcoatRoughness: 0.14, envMapIntensity: 1.15 }),
  frame: new THREE.MeshPhysicalMaterial({ color: '#30333c', metalness: 1, roughness: 0.38, roughnessMap: brushed, clearcoat: 0.3, clearcoatRoughness: 0.35, envMapIntensity: 0.8 }),
  chrome: new THREE.MeshPhysicalMaterial({ color: '#cfd3db', metalness: 1, roughness: 0.16, envMapIntensity: 1.1 }),
  capTop: new THREE.MeshPhysicalMaterial({ color: '#3a3d47', metalness: 1, roughness: 0.22, roughnessMap: brushed, clearcoat: 0.6, envMapIntensity: 1.0 }),
  anod: new THREE.MeshPhysicalMaterial({ color: '#15161c', metalness: 0.85, roughness: 0.33, clearcoat: 0.4, envMapIntensity: 1.0 }),
  btn: new THREE.MeshPhysicalMaterial({ color: '#262930', metalness: 0.95, roughness: 0.22, clearcoat: 0.8, clearcoatRoughness: 0.1, envMapIntensity: 1.2 }),
  glass: new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: 0.05, transparent: true, opacity: 0.05, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 0.18, depthWrite: false }),
  slot: new THREE.MeshStandardMaterial({ color: '#07070a', metalness: 0.5, roughness: 0.6 }),
};

// ---------- layout (px in the 1920 x 1080 design) ----------
const W = {
  art:       [80, 108, 505, 412, 22],
  spec:      [603, 108, 922, 196, 18],
  faders:    [603, 314, 922, 206, 18],
  meters:    [1543, 108, 297, 206, 18],
  vol:       [1543, 324, 297, 196, 18],
  surgeon:   [80, 534, 1760, 310, 22],
  transport: [80, 856, 1760, 118, 24],
  lufs:      [1404, 40, 416, 60, 12],
};
const FLOOR_Z = -0.25;

// ---------- body: back slab, faceplate with real recesses, raised frame ----------
{
  const back = rrPath(new THREE.Shape(), 8, 8, 1904, 1064, 56);
  { const [x, y, w, h, r] = W.art; back.holes.push(rrPath(new THREE.Path(), x, y, w, h, r)); }   // the stage box goes through the body
  const g = new THREE.ExtrudeGeometry(back, { depth: 0.6, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 6, curveSegments: 24 });
  const m = new THREE.Mesh(g, M.body); m.position.z = FLOOR_Z - 0.68 - 0.003; player.add(m);
  const front = rrPath(new THREE.Shape(), 2, 2, 1916, 1076, 60);
  for (const k in W) { const [x, y, w, h, r] = W[k]; front.holes.push(rrPath(new THREE.Path(), x, y, w, h, r)); }
  const fg = new THREE.ExtrudeGeometry(front, { depth: 0.21, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 4, curveSegments: 20 });
  const fm = new THREE.Mesh(fg, M.plate); fm.position.z = FLOOR_Z + 0.02; player.add(fm);
  // raised outer frame ring
  const ring = rrPath(new THREE.Shape(), 2, 2, 1916, 1076, 60);
  ring.holes.push(rrPath(new THREE.Path(), 34, 34, 1852, 1012, 40));
  const rg = new THREE.ExtrudeGeometry(ring, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.025, bevelSegments: 5, curveSegments: 20 });
  const rm = new THREE.Mesh(rg, M.frame); rm.position.z = 0.0; player.add(rm);
}

// ---------- flowing HEM Blend neon ----------
const neonCanvas = makeCanvas(640, 8);
{
  const g = neonCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 640, 0);
  [...BLEND, BLEND[0]].forEach((c, i) => gr.addColorStop(i / BLEND.length, c));
  g.fillStyle = gr; g.fillRect(0, 0, 640, 8);
}
const neonTex = canvasTex(neonCanvas);
neonTex.wrapS = THREE.RepeatWrapping; neonTex.repeat.set(4, 1);
const neonTexThin = neonTex.clone(); neonTexThin.needsUpdate = true; neonTexThin.repeat.set(2, 1);
const neonMat = new THREE.MeshBasicMaterial({ map: neonTex, toneMapped: false, color: new THREE.Color(2, 2, 2) });
const neonThin = new THREE.MeshBasicMaterial({ map: neonTexThin, toneMapped: false, color: new THREE.Color(1.5, 1.5, 1.5) });
function neonLoop(x, y, w, h, r, z, rad, mat, segs = 600) {
  const path = new THREE.CurvePath();
  rrPath(new THREE.Shape(), x, y, w, h, r).curves.forEach(c => path.add(c));
  const pts = path.getSpacedPoints(320).map(p => new THREE.Vector3(p.x, p.y, z));
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), segs, rad, 8, true), mat);
}
function neonBar(x0, x1, y, z, rad) {
  const c = new THREE.LineCurve3(new THREE.Vector3(X(x0), Y(y), z), new THREE.Vector3(X(x1), Y(y), z));
  return new THREE.Mesh(new THREE.TubeGeometry(c, 40, rad, 8, false), neonThin);
}
player.add(neonLoop(34, 34, 1852, 1012, 40, 0.012, 0.03, neonMat, 900));   // where frame meets plate
player.add(neonLoop(12, 12, 1896, 1056, 52, 0.11, 0.022, neonMat, 900));   // outer frame edge
for (const k in W) { const [x, y, w, h, r] = W[k]; player.add(neonLoop(x - 5, y - 5, w + 10, h + 10, r + 5, 0.006, 0.012, neonThin, 500)); }
[[150, 520, 70], [150, 640, 1012], [1280, 1770, 1012]].forEach(([a, b, y]) => player.add(neonBar(a, b, y, 0.01, 0.014)));

// ---------- canvas panels on well floors ----------
function floorPanel(key, scale, glass = true) {
  const [x, y, w, h] = W[key];
  const c = makeCanvas(Math.round(w * scale), Math.round(h * scale));
  const tex = canvasTex(c);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w / 100, h / 100), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  mesh.position.set(X(x + w / 2), Y(y + h / 2), FLOOR_Z + 0.004);
  player.add(mesh);
  if (glass) {
    const gl = new THREE.Mesh(new THREE.PlaneGeometry(w / 100 - 0.04, h / 100 - 0.04), M.glass);
    gl.position.set(X(x + w / 2), Y(y + h / 2), -0.035); gl.renderOrder = 2; player.add(gl);
  }
  // px (design) -> canvas px
  return { c, g: c.getContext('2d'), tex, s: scale, x, y, w, h, mesh, cx: px => (px - x) * scale, cy: py => (py - y) * scale };
}
function glassBg(p, top = '#0d0f17', bot = '#06070b') {
  const gr = p.g.createLinearGradient(0, 0, 0, p.c.height);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  p.g.fillStyle = gr; p.g.fillRect(0, 0, p.c.width, p.c.height);
}
const P = {
  art: floorPanel('art', 1.6),
  spec: floorPanel('spec', 1.5),
  faders: floorPanel('faders', 1.5, false),
  meters: floorPanel('meters', 2),
  vol: floorPanel('vol', 2, false),
  surgeon: floorPanel('surgeon', 1.25, false),
  transport: floorPanel('transport', 1.5, false),
  lufs: floorPanel('lufs', 2.4),
};

// printed / lit marks on the metal (header logo, footer line), redrawn as colours flow
function platePanel(x, y, w, h, scale) {
  const c = makeCanvas(Math.round(w * scale), Math.round(h * scale)), tex = canvasTex(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w / 100, h / 100), new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, depthWrite: false }));
  m.position.set(X(x + w / 2), Y(y + h / 2), 0.006); m.renderOrder = 3; player.add(m);
  return { c, g: c.getContext('2d'), tex, s: scale };
}
// Steven's own logos, from hem-elite-rack assets/brand (crown_badge.png, ghost.png), resized for the web.
const LOGO = { crown: new Image(), ghost: new Image() };
LOGO.crown.src = 'hem-crown.webp';
LOGO.ghost.src = 'hem-ghost.webp';
LOGO.ghost.onload = () => { if (typeof drawTransport === 'function' && typeof clock !== 'undefined') drawTransport(clock.elapsedTime); };
const head = platePanel(540, 34, 840, 70, 2);
const foot = platePanel(640, 994, 640, 36, 2);
function drawHead(t) {
  const g = head.g, s = head.s, w = head.c.width;
  g.clearRect(0, 0, w, head.c.height);
  const ph = t * FLOW;
  if (LOGO.crown.complete && LOGO.crown.naturalWidth) g.drawImage(LOGO.crown, 74 * s, 0, 70 * s, 70 * s);   // Steven's crown badge
  g.save(); g.shadowColor = blendCss(ph + 0.3, 0.9); g.shadowBlur = 16 * s;
  g.font = `900 ${36 * s}px Orbitron, system-ui, sans-serif`; g.textBaseline = 'middle'; g.textAlign = 'left';
  if ('letterSpacing' in g) g.letterSpacing = `${3 * s}px`;
  g.fillStyle = blendGrad(g, 170 * s, 800 * s, ph);
  g.fillText('HYBRID ELITE MAFIA', 170 * s, 26 * s);
  g.restore();
  text(g, 'LISTENING PLAYER', 485 * s, 56 * s, 15 * s, '#e9e4f5', 'center', 'Orbitron', 500, 0.55);
  head.tex.needsUpdate = true;
  const f = foot.g;
  f.clearRect(0, 0, foot.c.width, foot.c.height);
  text(f, 'HYBRID ELITE MAFIA  •  STUDIO PLUGINS', 320 * foot.s, 18 * foot.s, 15 * foot.s, blendGrad(f, 0, foot.c.width, ph + 0.5), 'center', 'Orbitron', 500, 0.42);
  foot.tex.needsUpdate = true;
}

// ---------- pickable controls ----------
const pickables = [];
const movers = [];   // buttons that travel when pressed
const knobs = [];

// knob: knurled body, chrome skirt, gold pointer, LED ring in flowing HEM Blend
const knobParts = (() => {
  const prof = [[0.43, 0], [0.43, 0.03], [0.405, 0.06], [0.405, 0.25], [0.38, 0.29], [0.34, 0.305], [0, 0.305]].map(([r, h]) => new THREE.Vector2(r, h));
  const body = new THREE.LatheGeometry(prof, 140);
  const pos = body.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y > 0.07 && v.y < 0.24) { const a = Math.atan2(v.z, v.x), k = 1 + 0.02 * Math.sin(a * 56); pos.setX(i, v.x * k); pos.setZ(i, v.z * k); }
  }
  body.computeVertexNormals(); body.rotateX(Math.PI / 2);
  return {
    body,
    skirt: new THREE.CylinderGeometry(0.5, 0.53, 0.05, 64).rotateX(Math.PI / 2),
    cap: new THREE.CylinderGeometry(0.315, 0.315, 0.014, 64).rotateX(Math.PI / 2),
    ptr: new RoundedBoxGeometry(0.05, 0.2, 0.02, 2, 0.01),
    led: new THREE.CircleGeometry(0.03, 14),
  };
})();
function makeKnob({ x, y, z = 0, size = 1, val = 0.5, read, change, dim }) {
  const root = new THREE.Group();
  root.position.set(X(x), Y(y), z); root.scale.setScalar(size);
  const sk = new THREE.Mesh(knobParts.skirt, M.chrome); sk.position.z = 0.025; root.add(sk);
  const spin = new THREE.Group(); spin.position.z = 0.05; root.add(spin);
  const bd = new THREE.Mesh(knobParts.body, M.anod); spin.add(bd);
  const cp = new THREE.Mesh(knobParts.cap, M.capTop); cp.position.z = 0.307; spin.add(cp);
  const pt = new THREE.Mesh(knobParts.ptr, M.gold || M.chrome); pt.position.set(0, 0.19, 0.318); spin.add(pt);
  const leds = [];
  for (let k = 0; k < 21; k++) {
    const th = THREE.MathUtils.degToRad(-135 + 270 * k / 20);
    const l = new THREE.Mesh(knobParts.led, new THREE.MeshBasicMaterial({ toneMapped: false }));
    l.position.set(Math.sin(th) * 0.62, Math.cos(th) * 0.62, 0.004); root.add(l); leds.push(l);
  }
  root.userData = { kind: 'knob', val, read, change, dim, spin, leds, seed: Math.random() };
  [sk, bd, cp, pt].forEach(m => { m.userData.owner = root; pickables.push(m); });
  player.add(root); knobs.push(root);
  return root;
}
M.gold = new THREE.MeshPhysicalMaterial({ color: '#ffc94a', metalness: 1, roughness: 0.22, envMapIntensity: 1.2 });
const LED_OFF = new THREE.Color('#25212d');
function paintKnob(k, t) {
  const u = k.userData;
  u.spin.rotation.z = -THREE.MathUtils.degToRad(-135 + 270 * u.val);
  const lit = Math.round(u.val * 20), off = u.dim && u.dim();
  u.leds.forEach((l, j) => {
    if (j <= lit && !off) l.material.color.copy(blendAt(j / 26 + t * FLOW + u.seed)).multiplyScalar(j === lit ? 3 : 1.6);
    else l.material.color.copy(LED_OFF);
  });
}

// button: rounded cap with its own label canvas on top
const btnGeoCache = {};
function makeButton({ x, y, w, h, depth = 0.16, draw, press, z }) {
  const key = `${w}x${h}x${depth}`;
  const geo = btnGeoCache[key] || (btnGeoCache[key] = new RoundedBoxGeometry(w / 100, h / 100, depth, 4, Math.min(0.06, h / 400)));
  const grp = new THREE.Group();
  const b = new THREE.Mesh(geo, M.btn); grp.add(b);
  const scale = 3, c = makeCanvas(Math.round(w * scale), Math.round(h * scale)), tex = canvasTex(c);
  const lab = new THREE.Mesh(new THREE.PlaneGeometry((w - 6) / 100, (h - 6) / 100), new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
  lab.position.z = depth / 2 + 0.002; grp.add(lab);
  const baseZ = z ?? FLOOR_Z + depth / 2;
  grp.position.set(X(x), Y(y), baseZ);
  const api = { kind: 'btn', baseZ, pressed: 0, travel: Math.min(0.06, depth * 0.4), press,
    redraw() { const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); draw(g, c.width, c.height, scale); tex.needsUpdate = true; } };
  grp.userData = api;

  zoomUi.querySelector('[data-z=in]').disabled = cam.zoom >= ZOOM_MAX - 0.01;
  zoomUi.querySelector('[data-z=out]').disabled = zoomUi.querySelector('[data-z=fit]').disabled = cam.zoom <= 1.001;
}
updateZoomUi();
// the help line gets out of the way: gone after the first touch, or 10 s after the player is first shown
const hintEl = document.getElementById('hint');
const dropHint = () => { if (hintEl) hintEl.hidden = true; };
canvas.addEventListener('pointerdown', dropHint, { once: true });
(function waitShown() { if (canvas.getBoundingClientRect().width) setTimeout(dropHint, 10000); else setTimeout(waitShown, 500); })();
let wheelHide = 0;

// =============================================================================
//  Sound: the HEM web engine (SURGEON + faders + volume, compiled from C++23 to WebAssembly)
//  runs on the browser's audio thread (hem-engine-worklet.js). Songs are opened from this
//  device and played from memory; nothing is uploaded anywhere.
//  The browser always hands the finished sound to the computer's own sound system; a web
//  page cannot use ASIO or WASAPI exclusive. The PC app will.
// =============================================================================
const eng = { ctx: null, node: null, an: null, aL: null, aR: null, ready: false, starting: null, readouts: new Float32Array(24).fill(-100, 17, 24), sent: new Map() };
const songs = [];
let curSong = -1, songBuf = null, srcNode = null, startAt = 0, pausedAt = 0, loadingSong = false, loadToken = 0;
const specBins = new Float32Array(4096), timeL = new Float32Array(2048), timeR = new Float32Array(2048);
const mmss = sec => { sec = Math.max(0, Math.floor(sec || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
const liveAudio = () => !!(eng.ready && playing && srcNode);
let toastTimer = 0;
function toast(msg) { readout.hidden = false; readout.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { if (!mode) readout.hidden = true; }, 2600); }

function send(t, i, v) {
  const key = t + i;
  if (eng.sent.get(key) === v) return;
  eng.sent.set(key, v);
  if (eng.node) eng.node.port.postMessage({ t, i, v });
}
// Every SURGEON control in hem-elite-rack's parameter order: band b control c = b * 12 + c.
function syncEngine() {
  bands.forEach((b, i) => {
    const o = i * 12;
    send('s', o + 0, b.on ? 1 : 0); send('s', o + 1, b.type); send('s', o + 2, b.freq); send('s', o + 3, b.gain);
    send('s', o + 4, b.q); send('s', o + 5, b.slope); send('s', o + 6, b.stereo); send('s', o + 7, b.dyn ? 1 : 0);
    send('s', o + 8, b.thr); send('s', o + 9, b.range); send('s', o + 10, b.att); send('s', o + 11, b.rel);
  });
  send('s', 192, SG.output); send('s', 193, SG.autoGain ? 1 : 0); send('s', 194, SG.character); send('s', 195, SG.drive);
  geqGain.forEach((d, i) => send('f', i, d));
  const vd = volDb(volKnob.userData.val); send('v', 0, vd === -Infinity ? -200 : vd);
}

function ensureAudio() {
  if (eng.ctx) { if (eng.ctx.state !== 'running') eng.ctx.resume().catch(() => {}); return eng.starting; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) { toast('This browser has no Web Audio, so it cannot play songs.'); return Promise.resolve(false); }
  eng.ctx = new Ctx({ latencyHint: 'playback' });
  eng.starting = (async () => {
    try {
      const wasm = await (await fetch('hem-engine.wasm')).arrayBuffer();
      await eng.ctx.audioWorklet.addModule('hem-engine-worklet.js');
      eng.node = new AudioWorkletNode(eng.ctx, 'hem-engine', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2], channelCount: 2, channelCountMode: 'explicit', processorOptions: { wasm } });
      eng.node.port.onmessage = e => {
        const m = e.data;
        if (m instanceof Float32Array) eng.readouts.set(m);
        else if (m.t === 'ready') eng.ready = true;
        else if (m.t === 'error') toast('The sound engine could not start: ' + m.message);
      };
      eng.an = eng.ctx.createAnalyser(); eng.an.fftSize = 8192; eng.an.smoothingTimeConstant = 0.6;
      const split = eng.ctx.createChannelSplitter(2);
      eng.aL = eng.ctx.createAnalyser(); eng.aR = eng.ctx.createAnalyser(); eng.aL.fftSize = eng.aR.fftSize = 2048;
      eng.node.connect(eng.ctx.destination); eng.node.connect(eng.an); eng.node.connect(split);
      split.connect(eng.aL, 0); split.connect(eng.aR, 1);
      eng.sent.clear(); syncEngine();
      eng.node.port.postMessage({ t: 'lt', v: lufsTarget });
      return true;
    } catch (err) {
      toast('The sound engine could not start in this browser.');
      return false;
    }
  })();
  return eng.starting;
}

function specTarget(t, f) {
  if (!liveAudio()) return sampleSpectrum(t, f);
  const hz = 20 * Math.pow(1000, f), n = eng.an.frequencyBinCount, nyq = eng.ctx.sampleRate / 2;
  const i0 = Math.floor(hz * 0.94 / nyq * n), i1 = Math.max(i0 + 1, Math.ceil(hz * 1.06 / nyq * n));
  let m = -160;
  for (let i = i0; i < i1 && i < n; i++) m = Math.max(m, specBins[i]);
  return clamp(m + 12, -60, 0);   // ASSUMED: +12 dB lifts the analyser's per-bin level onto the 0..-60 scale
}
function livePeaks() {
  if (!liveAudio()) return [0, 0];
  const pk = a => { let m = 0; for (let i = 0; i < a.length; i++) m = Math.max(m, Math.abs(a[i])); return clamp((20 * Math.log10(Math.max(m, 1e-6)) + 60) / 60, 0, 1); };
  eng.aL.getFloatTimeDomainData(timeL); eng.aR.getFloatTimeDomainData(timeR);
  return [pk(timeL), pk(timeR)];
}
function readSpectrum() { if (liveAudio()) eng.an.getFloatFrequencyData(specBins); }

function stopSrc() {
  if (!srcNode) return;
  const s = srcNode; srcNode = null;
  s.onended = null;
  try { s.stop(); } catch (e) { /* already stopped */ }
  s.disconnect();
}
function startSrc(offset) {
  stopSrc();
  const s = eng.ctx.createBufferSource();
  s.buffer = songBuf; s.connect(eng.node);
  s.onended = () => { if (srcNode === s) songEnded(); };
  startAt = eng.ctx.currentTime - offset;
  s.start(0, offset);
  srcNode = s; playing = true; redrawTransport();
}
function songPos() {
  if (!songBuf) return 0;
  return playing && srcNode ? Math.min(eng.ctx.currentTime - startAt, songBuf.duration) : pausedAt;
}
async function playIndex(i, offset = 0) {
  if (i < 0 || i >= songs.length) return;
  const ok = await ensureAudio(); if (!ok) return;
  stopSrc(); playing = false; curSong = i; songBuf = null; pausedAt = 0; loadingSong = true; redrawTransport();
  if (eng.node) eng.node.port.postMessage({ t: 'lr' });   // new song: loudness starts over
  eng.readouts.fill(-100, 17, 24);
  const token = ++loadToken;
  try {
    const bytes = await songs[i].file.arrayBuffer();
    const buf = await eng.ctx.decodeAudioData(bytes);
    if (token !== loadToken) return;
    songBuf = buf;
  } catch (err) {
    if (token !== loadToken) return;
    loadingSong = false; redrawTransport();
    toast(`Couldn't read "${songs[i].name}". WAV, MP3, FLAC or M4A usually work.`);
    return;
  }
  loadingSong = false;
  if (eng.ctx.state !== 'running') await eng.ctx.resume().catch(() => {});
  startSrc(offset);
}
async function play() {
  const ok = await ensureAudio(); if (!ok) return;
  if (eng.ctx.state !== 'running') await eng.ctx.resume().catch(() => {});
  if (playing) return;
  if (curSong < 0) { if (!songs.length) { toast('Tap ADD SONGS to pick songs from this device.'); return; } return playIndex(0); }
  if (!songBuf) return playIndex(curSong, pausedAt);
  startSrc(pausedAt);
}
function pause() { if (!playing) return; pausedAt = songPos(); stopSrc(); playing = false; redrawTransport(); }
function nextIndex() {
  if (!songs.length) return -1;
  if (shuffle && songs.length > 1) { let k; do k = Math.floor(Math.random() * songs.length); while (k === curSong); return k; }
  return curSong + 1 < songs.length ? curSong + 1 : -1;
}
function nextSong() { const n = nextIndex(); if (n >= 0) playIndex(n); else if (songs.length) toast('That was the last song.'); }
function prevSong() {
  if (curSong < 0) return;
  if (songPos() > 3 || curSong === 0) { if (songBuf) { playing ? startSrc(0) : (pausedAt = 0); redrawTransport(); } return; }
  playIndex(curSong - 1);
}
function songEnded() {
  srcNode = null; playing = false; pausedAt = 0;
  if (repeat) { startSrc(0); return; }
  const n = nextIndex();
  if (n >= 0) playIndex(n); else redrawTransport();
}
function seekTo(frac) {
  if (!songBuf) return;
  const at = frac * songBuf.duration;
  if (playing) startSrc(at); else { pausedAt = at; redrawTransport(); }
}
function redrawTransport() { Object.values(tBtns).forEach(b => b.userData.redraw()); drawTransport(clock.elapsedTime); }

// opening songs from this device
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.multiple = true; fileInput.hidden = true; fileInput.id = 'hem-song-picker';
fileInput.accept = 'audio/*,.wav,.mp3,.flac,.m4a,.aac,.ogg,.aif,.aiff';
document.body.appendChild(fileInput);
const isAudio = f => /^audio\//.test(f.type) || /\.(wav|mp3|flac|m4a|aac|ogg|aif|aiff)$/i.test(f.name);
function addFiles(list) {
  const before = songs.length;
  for (const f of list) if (isAudio(f)) songs.push({ name: f.name.replace(/\.[^.]+$/, ''), file: f });
  const added = songs.length - before;
  if (!added) { toast('No songs in that pick. WAV, MP3, FLAC or M4A files work.'); return; }
  toast(`${added} song${added === 1 ? '' : 's'} added`);
  if (curSong < 0) playIndex(before); else redrawTransport();
}
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
addEventListener('dragover', e => { e.preventDefault(); });
addEventListener('drop', e => { e.preventDefault(); ensureAudio(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
const addBtn = makeButton({ x: 1440, y: 878, w: 176, h: 26, depth: 0.1,
  draw: (g, w, h, s) => { g.fillStyle = '#16181f'; g.beginPath(); g.roundRect(s, s, w - 2 * s, h - 2 * s, 6 * s); g.fill(); g.strokeStyle = '#22e4ff'; g.lineWidth = 1.5 * s; g.stroke(); text(g, '+ ADD SONGS', w / 2, h / 2 + s, 12 * s, '#22e4ff', 'center', 'Orbitron', 700, 0.1); },
  press: () => { fileInput.click(); ensureAudio(); } });
function transportPoint(e) {
  setRay(e);
  const hit = ray.intersectObject(P.transport.mesh, false)[0];
  if (!hit) return null;
  const [x, y, w, h] = W.transport;
  return { x: x + hit.uv.x * w, y: y + (1 - hit.uv.y) * h };
}
// Lets the website's Playlists page load a playlist into the player (songs come from this device's own storage).
window.hemQueue = {
  set(list, start = 0) {
    stopSrc(); playing = false; loadToken++;
    songs.length = 0; list.forEach(x => songs.push({ name: x.name, file: x.file }));
    curSong = -1; songBuf = null; pausedAt = 0; loadingSong = false;
    if (songs.length) return playIndex(clamp(start, 0, songs.length - 1));
    redrawTransport();
  },
  list: () => songs.map(x => ({ name: x.name, file: x.file })),
  current: () => curSong,
  playAt: i => playIndex(i),
};
window.hemStatus = () => ({ engineReady: eng.ready, playing, song: curSong >= 0 ? songs[curSong].name : null, position: songPos(),
  peaks: livePeaks(), dynamic: Array.from(eng.readouts.slice(0, 17)), loudness: Array.from(eng.readouts.slice(17)), sampleRate: eng.ctx ? eng.ctx.sampleRate : null });

// ---------- loop ----------
const clock = new THREE.Clock();
let slowAcc = 1;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (mode !== 'orbit' && performance.now() - view.lastUser > 4000) { view.userRx *= 0.97; view.userRy *= 0.97; }
  animateRobot(t, dt);
  const sway = REDUCED ? 0 : 1;
  view.rx += (REST_RX + view.userRx + view.trx + Math.sin(t * 0.35) * 0.02 * sway - view.rx) * 0.08;
  view.ry += (REST_RY + view.userRy + view.try + Math.sin(t * 0.27) * 0.04 * sway - view.ry) * 0.08;
  const flat = clamp(2 - cam.zoom, 0, 1);   // straight-on once zoomed in, so the controls face you
  player.rotation.set(view.rx * flat, view.ry * flat, 0);
  player.position.y = Math.sin(t * 0.6) * 0.035 * sway;

  const sp = REDUCED ? 0.15 : 1;
  glints[0].position.set(Math.sin(t * 0.31 * sp) * 11, Math.cos(t * 0.23 * sp) * 4 + 2, 7);
  glints[1].position.set(Math.sin(t * 0.27 * sp + 2.1) * 11, Math.cos(t * 0.19 * sp + 1) * 4 - 2, 7);
  glints[2].position.set(Math.cos(t * 0.2 * sp) * 8, 6, 5);
  glints.forEach((l, i) => l.color.copy(blendAt(t * FLOW + i / 3)));

  neonTex.offset.x -= dt * FLOW * 4;
  neonTexThin.offset.x -= dt * FLOW * 2;

  movers.forEach(b => { const u = b.userData, target = u.baseZ - (u.pressed ? u.travel : 0); b.position.z += (target - b.position.z) * 0.35; });
  knobs.forEach(k => paintKnob(k, t));
  faders.forEach(f => placeFader(f, t));

  slowAcc += dt;
  if (slowAcc > 1 / 30) {
    slowAcc = 0;
    readSpectrum();
    drawArt(t); drawStageFloor(t); drawSpec(t); drawMeters(t); drawSurgeon(t); drawTransport(t); drawHead(t); drawHalo(t); drawLufs(t);
  }
  composer.render();
  requestAnimationFrame(frame);
}

async function boot() {
  try {
    await Promise.race([
      Promise.all(['700 20px Orbitron', '900 20px Orbitron', '500 20px Orbitron', '600 20px Rajdhani', '700 20px Rajdhani'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* system faces stand in */ }
  drawFaders(); drawVol();
  [...movers].forEach(b => b.userData.redraw());
  refreshSurgeon();
  requestAnimationFrame(frame);
}
boot();
</script>
